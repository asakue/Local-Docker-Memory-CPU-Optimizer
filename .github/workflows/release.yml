name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Multi-Architecture Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: dockertrim-windows-amd64.exe
          - goos: linux
            goarch: amd64
            output: dockertrim-linux-amd64
          - goos: linux
            goarch: arm64
            output: dockertrim-linux-arm64
          - goos: darwin
            goarch: amd64
            output: dockertrim-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: dockertrim-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.output }} .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*

